<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفة للعطور - Aldaffa ERP</title>
</head>
<body style="margin: 0; background-color: #030712;">
    <div id="root"></div>
    <div id="startup-error" style="display:none; position:fixed; inset:0; z-index:99999; background:#030712; color:#f3f4f6; font-family:system-ui,-apple-system,sans-serif; align-items:center; justify-content:center; padding:20px; direction:rtl; text-align:center;">
      <div style="background:#111827; border:1px solid #ef4444; border-radius:12px; padding:24px; max-width:540px; width:100%; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
        <h2 style="color:#ef4444; margin-top:0; font-size:20px;">تعذر بدء تشغيل واجهة النظام</h2>
        <p id="startup-error-msg" style="color:#d1d5db; font-size:13px; word-break:break-all; background:#1f2937; padding:12px; border-radius:8px; margin:16px 0; font-family:monospace;"></p>
        <button onclick="window.location.reload()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px;">إعادة تحميل التطبيق</button>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (!root || !root.children || root.children.length === 0) {
          var errBox = document.getElementById('startup-error');
          var errMsg = document.getElementById('startup-error-msg');
          if (errBox && errMsg) {
            errMsg.textContent = (e && e.message) ? e.message : 'خطأ غير متوقع';
            errBox.style.display = 'flex';
          }
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
